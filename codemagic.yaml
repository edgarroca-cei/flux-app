workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/flux.xcworkspace"
        XCODE_SCHEME: "flux"
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      
      - name: Install CocoaPods dependencies
        script: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
      
      - name: Build unsigned ipa
        script: |
          cd ios
          
          # Find workspace and scheme dynamically
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1 | sed 's|./||')
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -n 1 | xargs)
          
          echo "Building with workspace: $WORKSPACE and scheme: $SCHEME"
          
          # Build archive without signing
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/flux.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # The .app is in DerivedData, not in the xcarchive when building unsigned
          echo "=== Looking for .app in build output ==="
          
          # Search in common locations
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Build/Products/Release-iphoneos/*.app" 2>/dev/null | grep -i flux | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Trying alternative search..."
            APP_PATH=$(find . -name "*.app" -path "*/Release-iphoneos/*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            echo "Searching everywhere..."
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -10
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          
          # Create IPA manually
          mkdir -p Payload
          echo "Copying to Payload..."
          cp -r "$APP_PATH" Payload/
          
          echo "Contents of Payload:"
          ls -la Payload/
          
          echo "Creating IPA..."
          zip -r FLUX.ipa Payload
          
          echo "IPA structure:"
          unzip -l FLUX.ipa | head -20
          
          mkdir -p build
          mv FLUX.ipa build/
          echo "IPA created at build/FLUX.ipa"
          
    artifacts:
      - ios/build/FLUX.ipa
