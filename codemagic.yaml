workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/flux.xcworkspace"
        XCODE_SCHEME: "flux"
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      
      - name: Install CocoaPods dependencies
        script: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
      
      - name: Build iOS Archive
        script: |
          cd ios
          
          # Find workspace and scheme dynamically
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1 | sed 's|./||')
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -n 1 | xargs)
          
          echo "Building with workspace: $WORKSPACE and scheme: $SCHEME"
          
          # Build archive without code signing (we'll sign later with ESign)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/flux.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "=== Archive created successfully ==="
          
      - name: Create IPA from Archive
        script: |
          cd ios
          
          echo "=== Exploring archive structure ==="
          ls -laR build/flux.xcarchive/
          
          echo "=== Searching for .app files ==="
          find build/flux.xcarchive -name "*.app" -type d
          
          # Try multiple search strategies
          APP_PATH=$(find build/flux.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Not found in Products/Applications, searching entire archive..."
            APP_PATH=$(find build/flux.xcarchive -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive!"
            echo "=== Archive contents ==="
            ls -laR build/flux.xcarchive/
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          
          # Create IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          echo "=== Creating IPA ==="
          zip -r FLUX.ipa Payload
          
          # Move to build directory
          mkdir -p build
          mv FLUX.ipa build/
          
          # Cleanup
          rm -rf Payload
          
          echo "=== IPA created successfully ==="
          ls -lh build/FLUX.ipa
          
    artifacts:
      - ios/build/FLUX.ipa
