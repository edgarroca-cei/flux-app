workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/flux.xcworkspace"
        XCODE_SCHEME: "flux"
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      
      - name: Install CocoaPods dependencies
        script: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
      
      - name: Build with automatic signing
        script: |
          cd ios
          
          # Find workspace and scheme dynamically
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1 | sed 's|./||')
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -n 1 | xargs)
          
          echo "Building with workspace: $WORKSPACE and scheme: $SCHEME"
          
          # Build with automatic signing (Codemagic handles this)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/flux.xcarchive \
            archive
          
          echo "=== Archive created, exporting IPA ==="
          
          # Export IPA with automatic signing
          xcodebuild \
            -exportArchive \
            -archivePath build/flux.xcarchive \
            -exportPath build \
            -allowProvisioningUpdates \
            -exportOptionsPlist ../ExportOptions.plist
          
          echo "=== Checking for IPA ==="
          ls -la build/
          
          # If xcodebuild export failed, try manual method
          if [ ! -f build/*.ipa ]; then
            echo "Export failed, trying manual IPA creation..."
            
            # Find the .app
            APP_PATH=$(find build/flux.xcarchive -name "*.app" -type d | head -n 1)
            
            if [ -n "$APP_PATH" ]; then
              echo "Found .app at: $APP_PATH"
              mkdir -p Payload
              cp -r "$APP_PATH" Payload/
              zip -r build/FLUX.ipa Payload
              rm -rf Payload
              echo "Manual IPA created"
            else
              echo "ERROR: No .app found!"
              exit 1
            fi
          fi
          
          echo "=== Final IPA ==="
          ls -la build/*.ipa
          
    artifacts:
      - ios/build/FLUX.ipa
