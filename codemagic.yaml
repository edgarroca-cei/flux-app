workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/flux.xcworkspace"
        XCODE_SCHEME: "flux"
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      
      - name: Install CocoaPods dependencies
        script: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
      
      - name: Build iOS App
        script: |
          cd ios
          
          # Find workspace and scheme dynamically
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1 | sed 's|./||')
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -n 1 | xargs)
          
          echo "Building with workspace: $WORKSPACE and scheme: $SCHEME"
          
          # Build directly to get .app file (not archive)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "=== Build completed ==="
          
      - name: Create IPA from Build
        script: |
          cd ios
          
          echo "=== Searching for .app in build output ==="
          find build/DerivedData -name "*.app" -type d
          
          # Find the .app in the build output
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Not found in expected location, searching entire build directory..."
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in build output!"
            echo "=== Build directory structure ==="
            ls -laR build/DerivedData/Build/Products/ 2>/dev/null || ls -laR build/
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          
          # Create IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          echo "=== Creating IPA ==="
          zip -r FLUX.ipa Payload
          
          # Move to final location
          mkdir -p build
          mv FLUX.ipa build/
          
          # Cleanup
          rm -rf Payload
          
          echo "=== IPA created successfully ==="
          ls -lh build/FLUX.ipa
          
    artifacts:
      - ios/build/FLUX.ipa
