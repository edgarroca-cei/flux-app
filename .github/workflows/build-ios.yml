name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm install
      
      - name: Setup Expo
        run: npm install -g expo-cli eas-cli
      
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
      
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      
      - name: Build iOS Archive
        run: |
          cd ios
          xcodebuild -workspace FLUX.xcworkspace \
            -scheme FLUX \
            -configuration Release \
            -archivePath build/FLUX.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/FLUX.xcarchive \
            -exportPath build \
            -exportOptionsPlist ../ExportOptions.plist
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-IPA
          path: ios/build/*.ipa
