name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm install
      
      - name: Setup Expo
        run: npm install -g expo-cli eas-cli
      
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
      
      - name: Debug - List workspace contents
        run: |
          echo "=== Listing ios directory ==="
          ls -la ios/
          echo "=== Looking for .xcworkspace files ==="
          find ios -name "*.xcworkspace"
          echo "=== Looking for .xcodeproj files ==="
          find ios -name "*.xcodeproj"
      
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      
      - name: Debug - List schemes
        run: |
          cd ios
          echo "=== Checking for workspace files ==="
          ls -la *.xcworkspace 2>/dev/null || echo "No .xcworkspace files found"
          
          # Try to find the actual workspace name
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            echo "Found workspace: $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE"
          else
            echo "No workspace found, trying .xcodeproj"
            PROJECT=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
            if [ -n "$PROJECT" ]; then
              echo "Found project: $PROJECT"
              xcodebuild -list -project "$PROJECT"
            fi
          fi
      
      - name: Build iOS App
        run: |
          cd ios
          
          # Find workspace dynamically
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1 | sed 's|./||')
          
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No workspace found!"
            exit 1
          fi
          
          echo "Using workspace: $WORKSPACE"
          
          # Get the scheme name from the workspace
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -n 1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            echo "ERROR: No scheme found!"
            exit 1
          fi
          
          echo "Using scheme: $SCHEME"
          
          # Build with automatic signing
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            build
          
          echo "=== Build completed ==="
      
      - name: Create IPA from Build
        run: |
          cd ios
          
          echo "=== Searching for .app in build output ==="
          find build/DerivedData -name "*.app" -type d
          
          # Find the .app in the build output
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Not found in expected location, searching entire build directory..."
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in build output!"
            echo "=== Build directory structure ==="
            ls -laR build/DerivedData/Build/Products/ 2>/dev/null || ls -laR build/
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory
          mkdir -p Payload
          
          # Copy .app to Payload
          cp -r "$APP_PATH" Payload/
          
          # Create IPA (it's just a zip file)
          zip -r FLUX.ipa Payload
          
          # Move to build directory
          mkdir -p build
          mv FLUX.ipa build/
          
          # Cleanup
          rm -rf Payload
          
          echo "IPA created successfully at build/FLUX.ipa"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-IPA
          path: ios/build/FLUX.ipa
